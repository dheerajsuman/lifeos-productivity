<!DOCTYPE html>
<html>

<head>

    <title>LifeOS - Productivity Dashboard</title>

    <style>
        .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-top: 30px;
}

.card {
    background: #151824;
    padding: 20px;
    border-radius: 12px;
}

.card p {
    color: #a8adbd;
    margin: 0;
}

.card h2 {
    margin-top: 10px;
    font-size: 28px;
}

        body {
            margin: 0;
            background: #0b0d14;
            color: white;
            font-family: Arial, sans-serif;
        }

        .app {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 220px;
            padding: 25px;
            background: #151824;
        }

        .sidebar h2 {
            margin-bottom: 30px;
        }

        .sidebar button {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 12px;

            background: #1b1f2e;
            color: white;

            border: none;
            border-radius: 8px;

            cursor: pointer;
        }

        .sidebar button:hover {
            background: #292e42;
        }

        .main {
            flex: 1;
            padding: 40px;
        }

        .main h1 {
            font-size: 32px;
        }

        .main p {
            color: #a8adbd;
            font-size: 16px;
        }

    </style>

</head>
<body>

    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar">

            <h2>LifeOS</h2>

            <nav>
                <button>🏠 Dashboard</button>
                <button>✅ Tasks</button>
                <button>⏰ Routine</button>
                <button>📅 Calendar</button>
                <button>📝 Notes</button>
            </nav>

        </aside>


        <!-- Main Content -->
       <main class="main">

    <h1>Good day 👋</h1>

    <p>Build your day. Build your future.</p>


    <!-- Statistics -->
    <div class="stats">

        <div class="card">
            <p>🔥 Streak</p>
            <h2>0 days</h2>
        </div>

        <div class="card">
            <p>✅ Completed</p>
            <h2>0</h2>
        </div>

        <div class="card">
            <p>📋 Tasks</p>
            <h2>0</h2>
        </div>

        <div class="card">
            <p>📈 Productivity</p>
            <h2>0%</h2>
        </div>

    </div>

</main>

    </div>

</body>

    <h1>LifeOS</h1>

    <p>My Personal Productivity Dashboard</p>

</body>

</html>
