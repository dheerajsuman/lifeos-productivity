<!DOCTYPE html>
<html>

<head>

    <title>LifeOS - Productivity Dashboard</title>

    <style>
        .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-top: 30px;
}

.card {
    background: #151824;
    padding: 20px;
    border-radius: 12px;
}

.card p {
    color: #a8adbd;
    margin: 0;
}

.card h2 {
    margin-top: 10px;
    font-size: 28px;
}

        body {
            margin: 0;
            background: #0b0d14;
            color: white;
            font-family: Arial, sans-serif;
        }

        .app {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 220px;
            padding: 25px;
            background: #151824;
        }

        .sidebar h2 {
            margin-bottom: 30px;
        }

        .sidebar button {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 12px;

            background: #1b1f2e;
            color: white;

            border: none;
            border-radius: 8px;

            cursor: pointer;
        }

        .sidebar button:hover {
            background: #292e42;
        }

        .main {
            flex: 1;
            padding: 40px;
        }

        .main h1 {
            font-size: 32px;
        }

        .main p {
            color: #a8adbd;
            font-size: 16px;
        }
        .task-section {
    margin-top: 35px;
    background: #151824;
    padding: 25px;
    border-radius: 12px;
}

.task-section h2 {
    margin-top: 0;
}

.task-input {
    display: flex;
    gap: 10px;
}

.task-input input {
    flex: 1;
    padding: 12px;

    background: #0b0d14;
    color: white;

    border: 1px solid #303548;
    border-radius: 8px;

    outline: none;
}

.task-input button {
    padding: 12px 20px;

    background: #5b5ff7;
    color: white;

    border: none;
    border-radius: 8px;

    cursor: pointer;
}

.task-input button:hover {
    opacity: 0.85;
}

    </style>
   

</head>
<body>

    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar">

            <h2>LifeOS</h2>

            <nav>
                <button>🏠 Dashboard</button>
                <button>✅ Tasks</button>
                <button>⏰ Routine</button>
                <button>📅 Calendar</button>
                <button>📝 Notes</button>
            </nav>

        </aside>


        <!-- Main Content -->
       <main class="main">

    <h1>Good day 👋</h1>

    <p>Build your day. Build your future.</p>


    <!-- Statistics -->
    <div class="stats">

        <div class="card">
            <p>🔥 Streak</p>
            <h2>0 days</h2>
        </div>

        <div class="card">
            <p>✅ Completed</p>
            <h2>0</h2>
        </div>

        <div class="card">
            <p>📋 Tasks</p>
            <h2>0</h2>
        </div>

        <div class="card">
            <p>📈 Productivity</p>
            <h2>0%</h2>
        </div>

    </div>
           <!-- Task Section -->
<div class="task-section">

    <h2>Today's Tasks</h2>

    <div class="task-input">

        <input
            type="text"
            id="taskInput"
            placeholder="Enter a task..."
        >

        <button onclick="addTask()">
            Add Task
        </button>

    </div>

    <div id="taskList">

    </div>

</div>

</main>

    </div>

</body>

    <h1>LifeOS</h1>

    <p>My Personal Productivity Dashboard</p>
<script>

let tasks = JSON.parse(localStorage.getItem("lifeosTasks")) || [];


function saveTasks() {

    localStorage.setItem("lifeosTasks", JSON.stringify(tasks));

}


function renderTasks() {

    let taskList = document.getElementById("taskList");

    taskList.innerHTML = "";

    tasks.forEach(function(task, index) {

        taskList.innerHTML += `
            <div class="task">

                <span
                    class="${task.completed ? "completed" : ""}"
                    onclick="completeTask(${index})"
                >
                    ${task.completed ? "☑" : "☐"} ${task.text}
                </span>

                <button onclick="deleteTask(${index})">
                    🗑️
                </button>

            </div>
        `;

    });

}


function addTask() {

    let input = document.getElementById("taskInput");

    let taskText = input.value.trim();

    if (taskText === "") {

        alert("Please enter a task!");

        return;

    }


    tasks.push({

        text: taskText,

        completed: false

    });


    saveTasks();

    renderTasks();

    input.value = "";

}


function completeTask(index) {

    tasks[index].completed = !tasks[index].completed;

    saveTasks();

    renderTasks();

}


function deleteTask(index) {

    tasks.splice(index, 1);

    saveTasks();

    renderTasks();

}


renderTasks();

</script>
    
</body>
    
</html>
